{{define "title"}}Track {{.Month}}.{{.Year}}.{{end}} {{define "main"}}
<section class="flex flex-col gap-4">
  <div class="flex items-center justify-between">
    <h1 class="text-4xl font-semibold">
      Track finances for {{.Month}}.{{.Year}}.
    </h1>

    <div class="flex items-center gap-6">
      <a
        class="text-emerald-400! flex items-center gap-2 underline"
        href="/track/{{.Year}}/{{.Month}}/income"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-banknote-arrow-up-icon lucide-banknote-arrow-up"
        >
          <path d="M12 18H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5" />
          <path d="M18 12h.01" />
          <path d="M19 22v-6" />
          <path d="m22 19-3-3-3 3" />
          <path d="M6 12h.01" />
          <circle cx="12" cy="12" r="2" />
        </svg>
        Income
      </a>

      <a
        class="flex items-center gap-2 underline"
        href="/track/{{.Year}}/{{.Month}}/expense"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-banknote-arrow-down-icon lucide-banknote-arrow-down"
        >
          <path d="M12 18H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5" />
          <path d="m16 19 3 3 3-3" />
          <path d="M18 12h.01" />
          <path d="M19 16v6" />
          <path d="M6 12h.01" />
          <circle cx="12" cy="12" r="2" />
        </svg>
        Expense
      </a>
    </div>
  </div>

  <div>
    <h1 class="text-3xl text-blue-200">
      Current Balance: <span>{{.TotalAmount}} €</span>
    </h1>
    <hr />
    <h2 class="text-2xl text-emerald-200">
      Total Income: <span>{{.TotalIncome}} €</span>
    </h2>
    <h2 class="text-2xl text-red-200">
      Total Expense: <span>{{.TotalExpense}} €</span>
    </h2>
  </div>
</section>
{{end}}
