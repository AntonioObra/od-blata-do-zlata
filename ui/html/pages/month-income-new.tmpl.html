{{define "title"}}Add New Income {{.Month}}.{{.Year}}.{{end}} {{define "main"}}
<section class="flex flex-col gap-4">
  <div class="flex items-center justify-between">
    <h1 class="text-4xl font-semibold">
      Add new Income for {{.Month}}.{{.Year}}.
    </h1>

    <div class="flex items-center gap-6">
      <a
        class="flex items-center gap-2 underline"
        href="/track/{{.Year}}/{{.Month}}/income"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-undo2-icon lucide-undo-2"
        >
          <path d="M9 14 4 9l5-5" />
          <path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11" />
        </svg>
        Go Back
      </a>
    </div>
  </div>

  <form method="POST" action="/track/{{.Year}}/{{.Month}}/income/new">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}" />

    <div>
      <label for="name">Name</label>
      <input type="string" name="name" id="name" />
    </div>

    <div>
      <label for="amount">Amount</label>
      <input type="number" step="any" min="0" name="amount" id="amount" />
    </div>

    <div>
      <label for="incomeDate">Date</label>
      <input type="date" name="incomeDate" id="incomeDate" />
    </div>

    <div>
      <button type="submit">Add new Income</button>
    </div>
  </form>
</section>
{{end}}
