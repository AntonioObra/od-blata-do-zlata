{{define "nav"}}
<nav class="flex items-center justify-between">
  <div class="space-x-2">
    {{if .IsAuthenticated}}
    <a href="/" class="mr-4">Od Blata do Zlata</a>

    <a href="/track/{{.CurrentYear}}/{{.CurrentMonth}}/income/new"
      >Add new Income</a
    >
    <a href="/track/{{.CurrentYear}}/{{.CurrentMonth}}/expense/new"
      >Add new Expense</a
    >

    <a href="/track/types/new">Add new type</a>
    {{end}}
  </div>
  <div>
    {{if .IsAuthenticated}}
    <form action="/user/logout" method="POST">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}" />
      <button>Logout</button>
    </form>
    {{else}}
    <a href="/user/signup">Signup</a>
    <a href="/user/login">Login</a>
    {{end}}
  </div>
</nav>
{{end}}
